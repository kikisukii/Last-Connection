<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LAST CONNECTION — Time Attack</title>
  <style>
    @font-face { font-family:LC-SC; src:url('assets/fonts/LC-UI-SC.otf') format('opentype'); font-display:block; }
    @font-face { font-family:LC-JP; src:url('assets/fonts/LC-UI-JP.otf') format('opentype'); font-display:block; }
    :root { color-scheme: dark; --bg:#121821; --panel:#1d2733; --ink:#e9edf2; --muted:#b8c2ce; --accent:#68e2b4; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 LC-SC,sans-serif; }
    html[lang="ja"] body, html[lang="ja"] button { font-family:LC-JP,sans-serif; }
    #language .sheet { max-width:950px; text-align:center; gap:28px; }
    #language .actions { flex-wrap:wrap; }
    #language button { min-width:180px; }
    main { height:100vh; height:100dvh; display:grid; place-items:center; }
    canvas { display:block; width:min(100vw,1360px,calc(100dvh * 1360 / 690)); height:auto; outline:none; }
    [hidden] { display:none !important; }
    #status { position:fixed; bottom:4px; left:0; right:0; margin:0; text-align:center; color:var(--muted); font-size:12px; }
    body[data-screen="playing"] #status, body[data-ready="true"] #status { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    .menu { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
    .sheet { width:min(1240px,100%); display:flex; flex-direction:column; gap:20px; }
    header, footer { text-align:center; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:clamp(26px,3.5vw,44px); line-height:1.15; letter-spacing:.04em; }
    .subtitle { color:var(--muted); letter-spacing:.15em; font-size:13px; margin:7px 0 12px; }
    h2 { color:var(--accent); font-size:17px; letter-spacing:.1em; margin-bottom:7px; }
    .goal { font-size:17px; font-weight:600; }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .card { padding:24px; background:var(--panel); border-top:2px solid #344250; }
    .card.predict { border-top-color:var(--accent); }
    h3 { color:var(--accent); font-size:17px; margin-bottom:10px; }
    .card p + p { margin-top:7px; }
    .section-gap { margin-top:24px; }
    .keys { color:var(--accent); font-size:26px; font-weight:bold; margin-bottom:7px; }
    kbd { display:inline-block; border:1px solid #53687a; border-radius:4px; padding:0 11px; font:inherit; }
    .controls { font-size:14px; font-weight:650; }
    .lane-map { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; margin:17px 0; font-size:11px; color:var(--muted); }
    .lane-map span { border:1px solid #53687a; padding:7px 2px; }
    .lane-map .you { color:var(--accent); border-color:var(--accent); }
    .lane-copy { font-size:15px; }
    .lane-copy strong { color:var(--accent); }
    .deadline { font-weight:650; }
    .rank-caption { color:var(--muted); font-size:14px; margin-top:4px; }
    .ranks { color:var(--accent); font-size:24px; letter-spacing:.12em; margin-top:8px; }
    .rank-hint { color:var(--muted); font-size:13px; }
    .actions { display:flex; justify-content:center; gap:12px; margin-top:16px; }
    button { background:var(--accent); color:var(--bg); border:1px solid var(--accent); min-width:190px; padding:12px 24px; font:700 18px LC-SC,sans-serif; cursor:pointer; }
    button.secondary { background:transparent; color:var(--accent); }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    button:hover { filter:brightness(1.12); }
    button:disabled { opacity:.45; cursor:wait; }
    .key-hint { color:var(--muted); font-size:12px; margin-top:7px; }
    #results .sheet { max-width:640px; text-align:center; gap:16px; }
    #result-rank { color:var(--accent); font-size:46px; font-weight:700; }
    #result-time { font-size:40px; }
    #result-best { color:var(--accent); font-size:24px; }
    #results p { color:var(--muted); }
    @media (max-width:900px), (max-height:660px) {
      .menu { padding:10px; } .sheet { gap:10px; } .card { padding:12px; }
      .cards { gap:10px; } .card p { font-size:14px; } h3 { font-size:15px; margin-bottom:7px; }
      .subtitle { margin:4px 0 5px; } .section-gap { margin-top:12px; }
      .lane-map { margin:8px 0; } .lane-map span { padding:4px 2px; } .actions { margin-top:8px; }
    }
    @media (max-width:560px) and (min-height:501px) {
      .menu { padding:8px 10px; } .sheet { gap:7px; } h1 { font-size:24px; }
      .subtitle { font-size:10px; margin:4px 0 5px; } h2 { font-size:14px; margin-bottom:4px; }
      .goal { font-size:12px; } .cards { grid-template-columns:1fr; gap:7px; }
      .card { padding:8px 10px; } .card p { font-size:12px; line-height:1.3; }
      h3 { font-size:13px; margin-bottom:4px; } .section-gap { margin-top:8px; }
      .card p + p { margin-top:3px; } .keys { display:inline; font-size:18px; margin:0 8px 0 0; }
      .controls { display:inline; font-size:11px; } kbd { padding:0 6px; }
      .lane-map { display:none; } .lane-copy { margin-top:5px; }
      .lane-copy br { display:none; } .lane-copy strong { margin-right:6px; }
      .deadline { font-size:12px; } .rank-caption,.rank-hint { font-size:11px; }
      .ranks { font-size:18px; margin-top:3px; } .actions { margin-top:8px; }
      button { font-size:16px; padding:8px 18px; min-width:140px; } .key-hint { font-size:10px; margin-top:4px; }
    }
    @media (max-width:560px) and (min-height:501px) and (max-height:620px) {
      .menu { padding:6px 10px; } .sheet { gap:5px; } h1 { font-size:22px; }
      .subtitle { font-size:9px; margin:2px 0; } h2 { font-size:12px; margin-bottom:2px; }
      .goal { font-size:11px; } .cards { gap:5px; } .card { padding:6px 9px; }
      .card p { font-size:11.5px; line-height:1.25; } h3 { font-size:12px; margin-bottom:3px; }
      .section-gap { margin-top:5px; } .keys { font-size:16px; margin-right:5px; } kbd { padding:0 4px; }
      .card .controls { font-size:10px; } .lane-copy { margin-top:4px; }
      .deadline { font-size:11px; } .rank-caption { margin-top:2px; } .ranks { font-size:16px; }
      .actions { margin-top:5px; } button { font-size:14px; padding:6px 18px; }
    }
    @media (max-height:500px) {
      .menu { padding:8px; } .sheet { gap:8px; } h1 { font-size:24px; }
      .subtitle { font-size:10px; margin:2px 0; } h2 { font-size:12px; margin:2px 0; }
      .goal { font-size:12px; } .card { padding:10px; } h3 { font-size:12px; margin-bottom:5px; }
      .card p { font-size:12px; line-height:1.3; } .section-gap { margin-top:12px; }
      .keys { font-size:20px; margin-bottom:4px; } .controls { font-size:11px; }
      .lane-map { display:none; } .lane-copy { margin-top:10px; }
      .deadline,.rank-caption,.rank-hint { font-size:11px; } .ranks { font-size:17px; margin-top:2px; }
      footer .actions { margin-top:5px; } button { padding:6px 20px; font-size:15px; }
      .key-hint { font-size:10px; margin-top:3px; }
      #onboarding footer { display:grid; grid-template-columns:1fr 180px; column-gap:10px; }
      .deadline,.rank-caption,.ranks,.rank-hint { grid-column:1; }
      #onboarding footer .actions { grid-column:2; grid-row:1 / span 3; align-self:center; margin:0; }
      #onboarding footer .key-hint { grid-column:2; grid-row:4; }
      #onboarding footer button { min-width:120px; }
      body[data-screen="help"] #onboarding footer .actions { flex-direction:column; gap:4px; }
      .card { padding:8px; } .section-gap { margin-top:8px; }
      .lane-copy { margin-top:6px; } .card p + p { margin-top:5px; }
      #results .sheet { gap:6px; } #result-rank { font-size:30px; } #result-time { font-size:28px; }
    }
  </style>
</head>
<body data-screen="language">
  <main><canvas id="canvas" width="1360" height="690" tabindex="0" aria-label="LAST CONNECTION game" oncontextmenu="event.preventDefault()"></canvas></main>
  <section id="language" class="menu" aria-labelledby="language-title">
    <div class="sheet"><h1>LAST CONNECTION</h1><h2 id="language-title">SELECT LANGUAGE</h2>
      <div class="actions"><button data-language="0" lang="zh-CN" disabled>中文</button><button data-language="1" lang="en" disabled>English</button><button data-language="2" lang="ja" disabled>日本語</button></div>
    </div>
  </section>
  <section id="onboarding" class="menu" aria-labelledby="game-title" hidden>
    <div class="sheet">
      <header>
        <h1 id="game-title" data-copy="title">LAST CONNECTION</h1>
        <p class="subtitle" data-copy="subtitle"></p>
        <h2 data-copy="how"></h2><p class="goal"><span data-copy="goalLabel"></span> / <span data-copy="goal"></span></p>
      </header>
      <div class="cards">
        <article class="card">
          <div class="keys"><kbd>←</kbd> / <kbd>→</kbd></div>
          <p class="controls"><span data-copy="controlsLabel"></span> / <span data-copy="controls"></span></p>
          <div class="lane-map" aria-hidden="true"><span><b data-copy="left"></b><br><b data-copy="transport"></b></span><span class="you"><b data-copy="middle"></b><br><b data-copy="you"></b></span><span><b data-copy="right"></b><br><b data-copy="transport"></b></span></div>
          <p class="lane-copy"><strong data-copy="center"></strong><br><span data-copy="run"></span></p>
          <p class="lane-copy"><strong data-copy="sides"></strong><br><span data-copy="vehicles"></span></p>
        </article>
        <article class="card predict">
          <h3 data-copy="predict"></h3><p data-copy="early"></p><p data-copy="aim"></p>
          <h3 class="section-gap" data-copy="boarding"></h3><p data-copy="automatic"></p>
        </article>
        <article class="card">
          <h3 data-copy="miss"></h3><p data-copy="recover"></p>
          <h3 class="section-gap" data-copy="temporary"></h3><p data-copy="once"></p><p data-copy="next"></p>
        </article>
      </div>
      <footer>
        <p class="deadline" data-copy="deadline"></p><p class="rank-caption" data-copy="rank"></p>
        <p class="ranks" data-copy="ranks"></p><p class="rank-hint" data-copy="rankHint"></p>
        <div class="actions"><button id="start" disabled data-copy="start"></button><button id="back" class="secondary" hidden data-copy="back"></button></div>
        <p class="key-hint" data-copy="startHint"></p>
      </footer>
    </div>
  </section>
  <section id="results" class="menu" aria-labelledby="result-headline" hidden>
    <div class="sheet"><h1 id="result-headline"></h1><div id="result-rank"></div><div><p data-copy="finishTime"></p><div id="result-time"></div></div>
      <div><p data-copy="bestTime"></p><div id="result-best"></div></div><p id="result-note"></p>
      <div class="actions"><button id="again" data-copy="again"></button><button id="help" class="secondary" data-copy="how"></button></div>
      <p class="key-hint" data-copy="againHint"></p>
    </div>
  </section>
  <p id="status" role="status">LAST CONNECTION…</p>
  <script>
    const canvas=document.getElementById('canvas');
    const status=document.getElementById('status');
    const intro=document.getElementById('onboarding'), results=document.getElementById('results'), language=document.getElementById('language');
    const start=document.getElementById('start'), back=document.getElementById('back');
    // Responsive layout does the wrapping; a measured fallback accommodates
    // platform font metrics and unusually short windows without clipping.
    const fitMenus=()=>{
      for(const menu of [intro,results,language]) {
        if(menu.hidden) continue;
        const sheet=menu.querySelector('.sheet'), css=getComputedStyle(menu);
        const height=menu.clientHeight-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom);
        const width=menu.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight);
        const scale=Math.min(1,height/sheet.offsetHeight,width/sheet.offsetWidth);
        sheet.style.transform='scale('+scale+')';
      }
    };
    const menuObserver=new ResizeObserver(fitMenus);
    for(const menu of [intro,results,language]) menuObserver.observe(menu.querySelector('.sheet'));
    window.addEventListener('resize',fitMenus);
    document.fonts.ready.then(fitMenus);
    const request=action=>{ if(window.Module && Module._request_menu_action) { Module._request_menu_action(action); canvas.focus({preventScroll:true}); } };
    start.addEventListener('click',()=>request(1));
    document.getElementById('again').addEventListener('click',()=>request(1));
    document.getElementById('help').addEventListener('click',()=>request(2));
    back.addEventListener('click',()=>request(3));
    document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>{
      if(window.Module && Module._select_language) Module._select_language(Number(button.dataset.language));
    }));
    window.lcMenu={copy:{},show(screen,time,rank,best,fresh) {
      const t=key=>this.copy[key];
      const names=['start','playing','results','help','language'];
      document.body.dataset.screen=names[screen]; document.body.dataset.ready='true';
      language.hidden=screen!==4;
      document.querySelectorAll('[data-language]').forEach(button=>button.disabled=false);
      intro.hidden=screen!==0 && screen!==3; results.hidden=screen!==2;
      canvas.setAttribute('aria-hidden',screen===1?'false':'true');
      start.disabled=false; start.textContent=t(screen===3?'again':'start'); back.hidden=screen!==3;
      intro.querySelector('.key-hint').textContent=t(screen===3?'againHint':'startHint');
      document.getElementById('result-headline').textContent=t(rank==='F'?'missed':'reached');
      document.getElementById('result-time').textContent=time;
      document.getElementById('result-rank').textContent=t('rankLabel')+' '+rank;
      document.getElementById('result-rank').style.color=rank==='F'?'#ffa100':'var(--accent)';
      document.getElementById('result-best').textContent=best;
      document.getElementById('result-note').textContent=t(fresh?'newBest':'tryAgain');
      fitMenus();
      canvas.focus({preventScroll:true});
    }};
    var Module={canvas,print:(...args)=>console.log(...args),printErr:(...args)=>console.error(...args),
      onRuntimeInitialized:()=>{status.textContent='';canvas.focus({preventScroll:true});},
      onAbort:reason=>{status.textContent='Could not start: '+reason;document.body.dataset.ready='false';}
    };
    canvas.addEventListener('click',()=>canvas.focus({preventScroll:true}));
    window.addEventListener('keydown',event=>{
      // F1 belongs to the debug UI while this game page has focus.
      if(event.key==='F1') { event.preventDefault(); return; }
      if(!['ArrowLeft','ArrowRight','Enter',' '].includes(event.key)) return;
      if(document.body.dataset.screen!=='playing') {
        event.preventDefault();event.stopImmediatePropagation();
        if(event.repeat) return;
        if((event.key==='Enter'||event.key===' ') && event.target instanceof HTMLButtonElement) event.target.click();
        else if(document.body.dataset.screen!=='language') request(1);
      } else if(event.key==='ArrowLeft'||event.key==='ArrowRight') event.preventDefault();
    },true);
  </script>
  {{{ SCRIPT }}}
</body>
</html>
